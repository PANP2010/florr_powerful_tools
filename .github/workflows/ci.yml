name: CI Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m venv venv
          venv/bin/pip install --upgrade pip
          venv/bin/pip install playwright
          venv/bin/python -m playwright install chromium --with-deps

      - name: Install project dependencies
        run: |
          venv/bin/pip install \
            PyQt5 \
            opencv-python \
            numpy \
            pillow \
            pyyaml \
            pyautogui \
            mss \
            pynput \
            ultralytics \
            torch

      - name: Run module tests
        run: |
          venv/bin/python browser_test_env/module_tester.py

      - name: Run screenshot tests
        run: |
          venv/bin/python browser_test_env/screenshot_tester.py --url https://github.com --name github_preview
