general:
  auto_start: false
  language: zh_CN
  minimize_to_tray: true
  theme: dark
modules:
  afk:
    auto_respond: true
    check_interval: 0.5
    enabled: true
    llm_enabled: false
    llm_model: qwen2.5:14b
    llm_provider: ollama
  combat:
    auto_dodge: true
    enabled: true
    sandstorm_avoid: true
    target_priority: nearest
  pathing:
    auto_navigate: false
    avoid_danger: true
    enabled: true
    target_map: ocean
  stats:
    enabled: true
    export_format: json
    track_efficiency: true
    track_petals: true
paths:
  logs_dir: logs
  models_dir: models
  screenshots_dir: assets/screenshots
platform:
  capture_fps: 30
  game_window: florr.io
  input_method: pyautogui
  screen_capture: auto
ui:
  always_on_top: false
  opacity: 0.95
  show_notifications: true
  window_height: 600
  window_width: 800
